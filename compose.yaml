services:
  campus-help-server:

    build:
      context: .
      dockerfile: Dockerfile

    container_name: campus-help-server

    ports:
      - "5000:5000/tcp"
      - "5001:5001/udp"
      - "2121:2121/tcp"
      - "30000-30009:30000-30009/tcp"
      - "8000:8000/tcp"

    volumes:
      - ./database:/app/database
      - ./files:/app/files

    environment:
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}

    restart: unless-stopped